<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pocket: home</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#1C2530}a:hover{color:#8A6420}
a:focus-visible,button:focus-visible{outline:3px solid #B5862F;outline-offset:3px}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#E9ECEF;color:#1C2530;font-family:'Atkinson Hyperlegible Next','Atkinson Hyperlegible',system-ui,sans-serif;padding:56px 20px 24px;display:flex;flex-direction:column;gap:16px;overflow:hidden">

  <header style="display:flex;justify-content:space-between;align-items:center">
    <div style="display:flex;align-items:center;gap:10px">
      <svg width="24" height="24" viewBox="0 0 34 34" aria-hidden="true"><rect x="1" y="1" width="15" height="32" rx="7.5" fill="#1C2530"></rect><rect x="18" y="1" width="15" height="32" rx="7.5" fill="#B5862F"></rect></svg>
      <span style="font-family:'Archivo',sans-serif;font-stretch:118%;font-weight:800;font-size:18px">Pocket</span>
    </div>
    <span style="font-size:14px;color:#46525F">qor1h7…2xk9</span>
  </header>

  <section aria-label="Pocket balance" style="background:#1C2530;color:#E9ECEF;border-radius:24px;padding:22px 22px 20px;display:flex;flex-direction:column;gap:16px">
    <div style="display:flex;flex-direction:column;gap:4px">
      <span style="font-size:14px;color:#B9C2CC">In your pocket</span>
      <span style="font-family:'Archivo',sans-serif;font-stretch:108%;font-weight:850;font-size:46px;line-height:1;letter-spacing:-0.02em">18.40 <span style="font-size:22px;font-weight:700">fUSD</span></span>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px">
      <div style="display:flex;justify-content:space-between;font-size:14px;color:#C9D1D9">
        <span>Window open until 23:00</span>
        <span>4 of 5 payments left</span>
      </div>
      <div role="img" aria-label="4 of 5 payments left in today's window" style="display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px">
        <span style="height:8px;border-radius:4px;background:#5B6672"></span>
        <span style="height:8px;border-radius:4px;background:#E9ECEF"></span>
        <span style="height:8px;border-radius:4px;background:#E9ECEF"></span>
        <span style="height:8px;border-radius:4px;background:#E9ECEF"></span>
        <span style="height:8px;border-radius:4px;background:#E9ECEF"></span>
      </div>
    </div>
    <p style="margin:0;font-size:15px;line-height:1.45;color:#E9ECEF;background:#2A3542;border-radius:12px;padding:12px 14px">If someone has your 24 words, this is the most they could take right now: 18.40 fUSD.</p>
    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
      <button type="button" style="font:inherit;font-weight:700;font-size:16px;min-height:48px;border:0;border-radius:12px;background:#E9ECEF;color:#1C2530;cursor:pointer">Pay</button>
      <button type="button" style="font:inherit;font-weight:700;font-size:16px;min-height:48px;border:0;border-radius:12px;background:#2A3542;color:#E9ECEF;cursor:pointer">Close window</button>
    </div>
  </section>

  <section aria-label="Vault" style="background:#F1E3BF;color:#3F2E0B;border-radius:24px;padding:20px 22px;display:flex;flex-direction:column;gap:12px">
    <div style="display:flex;justify-content:space-between;align-items:baseline">
      <span style="font-size:14px;color:#5E4513">At home, in your vault</span>
      <span style="font-size:13px;color:#5E4513">Needs Home Key</span>
    </div>
    <span style="font-family:'Archivo',sans-serif;font-stretch:108%;font-weight:850;font-size:32px;line-height:1">1,000 <span style="font-size:17px;font-weight:700">fUSD</span></span>
    <a href="PocketAsk.dc.html" style="display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:12px;background:#3F2E0B;color:#F1E3BF;text-decoration:none;font-weight:700;font-size:16px">Top up pocket</a>
  </section>

  <section aria-labelledby="recent" style="display:flex;flex-direction:column;gap:4px">
    <h2 id="recent" style="margin:0 0 6px;font-family:'Archivo',sans-serif;font-stretch:112%;font-weight:800;font-size:17px">Today</h2>
    <sc-for list="{{items}}" as="it" hint-placeholder-count="3">
      <div style="display:flex;justify-content:space-between;align-items:center;padding:12px 2px;border-bottom:1px solid #D2D8DE;font-size:15px">
        <span style="display:flex;flex-direction:column;gap:2px">
          <span style="font-weight:700">{{it.what}}</span>
          <span style="font-size:13px;color:#46525F">{{it.when}}</span>
        </span>
        <span style="font-weight:700;color:{{it.color}}">{{it.amount}}</span>
      </div>
    </sc-for>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      items: [
        { what: "Mama Chika's shop", when: "14:10, from pocket", amount: "-1.60 fUSD", color: "#1C2530" },
        { what: "Window opened by Home Key", when: "09:02, 5 payments, 20 fUSD", amount: "", color: "#1C2530" },
        { what: "Top up from vault", when: "09:01, approved at home", amount: "+20.00 fUSD", color: "#2E6A50" }
      ]
    };
  }
}
</script>
</body>
</html>
