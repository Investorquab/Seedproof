<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pocket: asking the Home Key</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&amp;display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#1C2530}a:hover{color:#8A6420}
a:focus-visible,button:focus-visible{outline:3px solid #B5862F;outline-offset:3px}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#E9ECEF;color:#1C2530;font-family:'Atkinson Hyperlegible Next','Atkinson Hyperlegible',system-ui,sans-serif;padding:56px 20px 24px;display:flex;flex-direction:column;gap:18px">

  <header style="display:flex;align-items:center;gap:12px">
    <a href="Pocket.dc.html" aria-label="Back to Pocket" style="display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:12px;background:#F7F8F9;text-decoration:none">
      <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 4 6.5 10l6 6" fill="none" stroke="#1C2530" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
    </a>
    <h1 style="margin:0;font-family:'Archivo',sans-serif;font-stretch:112%;font-weight:800;font-size:22px">Show this to your Home Key</h1>
  </header>

  <section aria-label="What you are asking for" style="background:#F7F8F9;border-radius:18px;padding:18px 18px;display:flex;flex-direction:column;gap:6px">
    <span style="font-size:14px;color:#46525F">You are asking to</span>
    <span style="font-size:19px;font-weight:700;line-height:1.35">Top up your pocket with 30 fUSD from your vault</span>
    <span style="font-size:14px;color:#46525F">Your Home Key will read this back to you before it signs.</span>
  </section>

  <figure style="margin:0;background:#FFFFFF;border-radius:22px;padding:22px;display:flex;flex-direction:column;align-items:center;gap:14px">
    <div role="img" aria-label="Animated QR code carrying the request, frame 3 of 8" style="display:grid;grid-template-columns:repeat(29,minmax(0,1fr));width:290px;height:290px">
      <sc-for list="{{cells}}" as="c" hint-placeholder-count="841">
        <span style="background:{{c.fill}}"></span>
      </sc-for>
    </div>
    <figcaption style="display:flex;flex-direction:column;align-items:center;gap:8px;width:100%">
      <div aria-hidden="true" style="display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px;width:100%">
        <span style="height:5px;border-radius:3px;background:#1C2530"></span>
        <span style="height:5px;border-radius:3px;background:#1C2530"></span>
        <span style="height:5px;border-radius:3px;background:#1C2530"></span>
        <span style="height:5px;border-radius:3px;background:#C9CFD6"></span>
        <span style="height:5px;border-radius:3px;background:#C9CFD6"></span>
        <span style="height:5px;border-radius:3px;background:#C9CFD6"></span>
        <span style="height:5px;border-radius:3px;background:#C9CFD6"></span>
        <span style="height:5px;border-radius:3px;background:#C9CFD6"></span>
      </div>
      <span style="font-size:14px;color:#46525F">The request is too big for one QR code, so it plays in 8 frames. Hold it in front of the Home Key camera.</span>
    </figcaption>
  </figure>

  <div style="margin-top:auto;display:flex;flex-direction:column;gap:10px">
    <a href="HomeKeyReview.dc.html" style="display:flex;align-items:center;justify-content:center;min-height:52px;border-radius:12px;background:#1C2530;color:#E9ECEF;text-decoration:none;font-weight:700;font-size:17px">Scan the Home Key's answer</a>
    <a href="Pocket.dc.html" style="display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:12px;text-decoration:none;font-weight:700;font-size:16px;color:#1C2530">Cancel request</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var n = 29, seed = 7, cells = [];
    function rnd() { seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; }
    function finder(r, c) {
      var spots = [[0, 0], [0, n - 7], [n - 7, 0]];
      for (var i = 0; i < spots.length; i++) {
        var dr = r - spots[i][0], dc = c - spots[i][1];
        if (dr >= -1 && dr <= 7 && dc >= -1 && dc <= 7) {
          if (dr < 0 || dc < 0 || dr > 6 || dc > 6) return 0;
          var edge = dr === 0 || dc === 0 || dr === 6 || dc === 6;
          var core = dr >= 2 && dr <= 4 && dc >= 2 && dc <= 4;
          return edge || core ? 1 : 0;
        }
      }
      return -1;
    }
    for (var r = 0; r < n; r++) {
      for (var c = 0; c < n; c++) {
        var f = finder(r, c);
        var on = f === -1 ? (r === 6 || c === 6 ? (r + c) % 2 === 0 : rnd() > 0.52) : f === 1;
        cells.push({ fill: on ? "#1C2530" : "#FFFFFF" });
      }
    }
    return { cells: cells };
  }
}
</script>
</body>
</html>
